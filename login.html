<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Bontang Aquatik</title>
  <link rel="stylesheet" href="assets/css/global.css">
  <link rel="stylesheet" href="assets/css/navbar.css">
  <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>

  <div class="auth-page">
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <div class="icon">🔐</div>
          <h1>Masuk ke Akun</h1>
          <p>Login sebagai peserta atau admin</p>
        </div>
        <div class="auth-body">
          <form id="form-login">
            <div class="form-group">
              <label for="username">Username *</label>
              <input type="text" id="username" name="username" class="form-control" required autofocus>
            </div>
            <div class="form-group">
              <label for="password">Password *</label>
              <div class="password-wrap">
                <input type="password" id="password" name="password" class="form-control" required>
                <button type="button" class="password-toggle" id="toggle-password" aria-label="Toggle password">👁️</button>
              </div>
            </div>
            <button type="submit" class="btn btn-primary btn-block mt-2">Masuk</button>
          </form>
        </div>
        <div class="auth-footer">
          Belum punya akun? <a href="registrasi.html">Daftar di sini</a>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/login.js"></script>
</body>
</html>
